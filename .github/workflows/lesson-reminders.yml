# Напоминания пройти урок английского: Telegram и push в приложение, каждый день в 16:00 и 19:00.
# Запуск каждый час, скрипты сами проверяют местное время (REMIND_TZ), поэтому
# часовой пояс меняется переменной, без правки расписания.
# Настройка: reminders/README.md.
name: Lesson reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Что сделать"
        type: choice
        options: [test, chats]
        default: test

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY || 'BDAi5C8ne202Y3UocPtPGlVZJrcsLrXZrQOMjR2xxqvOz1vGuRZVD6Ndr5jeg5IsS_TdfF1zkUq6vT5E-rYghEI' }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      REMIND_TZ: ${{ vars.REMIND_TZ || 'Asia/Yekaterinburg' }}
      REMIND_HOURS: ${{ vars.REMIND_HOURS || '16,19' }}
      APP_URL: ${{ vars.APP_URL || 'https://dyphilippov2-beep.github.io/block-english/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        run: |
          case "${{ github.event.inputs.command }}" in
            test)  python reminders/telegram_remind.py --force ;;
            chats) python reminders/telegram_remind.py chats ;;
            *)     python reminders/telegram_remind.py ;;
          esac

      - name: Push
        if: env.VAPID_PRIVATE_KEY != '' && github.event.inputs.command != 'chats'
        run: |
          npm install --prefix reminders --no-save --no-package-lock web-push@3.6.7
          node reminders/push_remind.mjs ${{ github.event.inputs.command == 'test' && '--force' || '' }}
