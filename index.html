<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block English">
<meta name="theme-color" content="#1b1f2a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Block English</title>
<style>
:root{--bg:#1b1f2a;--panel:#2a3042;--panel2:#353c53;--edge:#0d1017;--text:#f4f1e6;--muted:#a3a8bb;--green:#5fbf3f;--red:#e0503f;--gold:#f2c230;--blue:#4f8ce0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 24px}
button{font:inherit;color:inherit;touch-action:manipulation}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 14px;border:3px solid var(--edge);background:var(--green);color:#fff;font-weight:800;font-size:19px;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:inset -4px -5px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.22);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn.blue{background:var(--blue)}.btn.gray{background:#6d7285}.btn.gold{background:#d9a514}.btn.red{background:var(--red)}
.btn.small{min-height:44px;font-size:16px}
.btn img{height:26px}
.panel{background:var(--panel);border:3px solid var(--edge);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.06);padding:14px}
.title{font-weight:900;font-size:30px;letter-spacing:2px;text-align:center;margin:6px 0 2px;text-shadow:3px 3px 0 #000;color:#fff}
.title span{color:var(--green)}
.sub{color:var(--muted);text-align:center;font-size:14px;margin-bottom:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;text-align:center;padding:8px 4px;font-weight:800;font-size:17px}
.stat small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.grass{height:14px;margin:0 -16px 14px;background:repeating-linear-gradient(90deg,#5fbf3f 0 8px,#4ea832 8px 14px,#6fcf4a 14px 20px),#5fbf3f;border-bottom:10px solid #86603f}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero .me{height:104px;flex:none}
.hero .tools{display:flex;gap:6px;margin:6px 0}
.hero .tools img{width:38px;height:38px;background:#14171f;border:2px solid var(--edge);padding:2px}
.hero .h1{font-weight:900;font-size:17px}
.hero .h2{font-size:13px;color:var(--muted);line-height:1.35}
.hero .h2 b{color:var(--gold)}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lesson{position:relative;text-align:left;padding:12px;min-height:100px;border:3px solid var(--edge);background:var(--panel2);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.08);cursor:pointer}
.lesson .ic{height:36px;display:flex;align-items:center}
.lesson .n{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.lesson .t{font-weight:800;font-size:15px;line-height:1.15}
.lesson .st{position:absolute;top:8px;right:9px;font-size:18px}
.lesson.locked{opacity:.45}
.lesson.done{background:#2f4a33}
.lesson.next{outline:3px solid var(--gold);outline-offset:-6px}
.row{display:flex;gap:10px}
.tip{color:var(--muted);font-size:13px;text-align:center;margin-top:12px;line-height:1.4}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{width:44px;height:44px;flex:none;border:3px solid var(--edge);background:var(--panel2);font-size:20px;font-weight:900}
.bar{flex:1;height:22px;border:3px solid var(--edge);background:#14171f;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7ad655,#4ea832);transition:width .3s}
.hearts{font-size:18px;flex:none}
.stage-name{text-align:center;font-weight:800;color:var(--gold);font-size:15px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.prompt{text-align:center;font-size:18px;color:var(--muted);margin:6px 0 10px;min-height:24px}
.big{display:flex;justify-content:center;align-items:center;min-height:110px;margin:6px 0}
.pic{display:block}
.word{font-size:40px;font-weight:900;text-align:center;letter-spacing:1px}
.ru{font-size:20px;text-align:center;color:var(--muted);margin-top:2px}
.pr{font-size:17px;text-align:center;color:var(--gold);margin-top:4px}
.say{display:block;margin:10px auto;width:76px;height:76px;font-size:36px;border:3px solid var(--edge);background:var(--blue);box-shadow:inset -4px -5px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.22)}
.say:active{transform:translateY(2px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{min-height:96px;border:3px solid var(--edge);background:var(--panel2);font-size:22px;font-weight:800;box-shadow:inset -4px -5px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.08);padding:8px;display:flex;align-items:center;justify-content:center}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--green)!important}.opt.bad{background:var(--red)!important}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0;min-height:56px}
.slot{min-width:42px;height:52px;padding:0 6px;border:3px solid var(--edge);background:#14171f;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.slot.w{font-size:20px;padding:0 10px}
.slots.ok .slot{background:var(--green)}.slots.bad .slot{background:var(--red)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.tile{min-width:52px;height:56px;padding:0 10px;border:3px solid var(--edge);background:#c9a26b;color:#2a1a08;font-size:26px;font-weight:900;box-shadow:inset -4px -5px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.3)}
.tile.w{font-size:20px}
.tile.used{visibility:hidden}
.answer{text-align:center;font-size:20px;font-weight:800;margin-top:10px;min-height:28px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);pointer-events:none;display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;text-shadow:2px 2px 0 #000;animation:fly 1s forwards;z-index:9}
.toast img{width:40px;height:40px;border:2px solid #000}
@keyframes fly{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.card{text-align:center;padding:18px 12px}
.center{text-align:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:900;letter-spacing:3px;text-align:center;color:var(--gold);margin:6px 0}
.chest{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}
.chest div{display:flex;align-items:center;gap:4px;font-weight:800;background:#14171f;border:2px solid var(--edge);padding:4px 8px 4px 4px}
.chest img{width:28px;height:28px}
.newtools{display:flex;justify-content:center;gap:8px;margin:8px 0}
.newtools img{width:52px;height:52px;background:#14171f;border:2px solid var(--edge);padding:3px}
/* битва */
.arena{position:relative;display:flex;align-items:flex-end;justify-content:space-between;height:156px;padding:0 18px 10px;margin-bottom:8px;border:3px solid var(--edge);background:linear-gradient(#232a44 0,#36406a 72%,#6b4c30 72%,#5a3f27 100%);overflow:hidden}
.fighter{position:relative;display:flex;align-items:flex-end}
.fighter .body{height:96px}
.fighter .tool{height:42px;margin:0 0 26px -8px}
.fighter .body.sq{height:80px}
.hp{position:absolute;top:8px;right:12px;width:110px;height:14px;border:2px solid #000;background:#3a1010}
.hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b5a,#c62f20);transition:width .3s}
.bossname{position:absolute;top:26px;right:12px;font-weight:900;font-size:13px;text-shadow:1px 1px 0 #000}
.vs{font-weight:900;font-size:20px;color:var(--gold);text-shadow:2px 2px 0 #000;margin-bottom:40px}
.hit{animation:hit .45s}
@keyframes hit{0%{filter:brightness(3)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}100%{filter:none}}
.attack{animation:atk .45s}
@keyframes atk{40%{transform:translateX(26px) rotate(25deg)}}
.dmg{position:absolute;right:40px;bottom:70px;font-weight:900;font-size:26px;color:#ff6b5a;text-shadow:2px 2px 0 #000;animation:fly2 .8s forwards}
@keyframes fly2{to{transform:translateY(-40px);opacity:0}}
/* мир */
.world{display:grid;grid-template-columns:repeat(8,1fr);border:3px solid var(--edge);background:linear-gradient(#79a9ff,#b9d6ff 70%,#d8e8ff);touch-action:manipulation}
.cell{aspect-ratio:1;border:0;padding:0;background:transparent;outline:1px solid rgba(255,255,255,.12)}
.cell img{width:100%;height:100%;display:block}
.inv{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.it{flex:none;width:72px;border:3px solid var(--edge);background:var(--panel2);padding:6px 4px;text-align:center;font-size:12px;font-weight:700}
.it img{width:40px;height:40px;display:block;margin:0 auto 4px}
.it b{display:block;font-size:13px;color:var(--gold)}
.it.sel{background:#4a6a3a;outline:3px solid var(--gold);outline-offset:-6px}
.it.zero{opacity:.35}
.mode{display:flex;gap:8px;margin-top:8px}
.mode .btn{min-height:46px;font-size:16px}
.mode .btn.off{background:#4c5164}
.selname{text-align:center;font-weight:900;font-size:20px;margin-top:8px;min-height:26px}
input{font:inherit;font-size:20px;width:100%;padding:12px;border:3px solid var(--edge);background:#14171f;color:var(--text);-webkit-user-select:text;user-select:text;border-radius:0}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;font-weight:700}
.gap{height:10px}
</style>
</head>

function beep(type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t=AC.currentTime;
    const seq = type==="ok"?[[660,0],[990,.08]] : type==="bad"?[[220,0],[160,.12]] : type==="win"?[[523,0],[659,.1],[784,.2],[1046,.32]] : type==="hit"?[[180,0],[120,.05],[300,.1]] : [[880,0]];
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(.05,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.17)});
  }catch(e){}
}

const TEX={};
function tex(type){
  if(TEX[type])return TEX[type];
  const c=document.createElement("canvas");c.width=c.height=16;const x=c.getContext("2d");
  let seed=[...type].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)>>>0;
  const r=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  const px=(i,j,[R,G,B],v=0,a=1)=>{x.fillStyle=`rgba(${Math.max(0,Math.min(255,R+v))|0},${Math.max(0,Math.min(255,G+v))|0},${Math.max(0,Math.min(255,B+v))|0},${a})`;x.fillRect(i,j,1,1)};
  const n=k=>(r()-.5)*k;
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){
    const edge=i===0||j===0||i===15||j===15;
    switch(type){
      case "dirt": px(i,j,[134,96,67],n(40)+(r()<.08?-30:0));break;
      case "grass": (j<3||(j===3&&r()<.6)||(j===4&&r()<.25))?px(i,j,[95,165,55],n(40)):px(i,j,[134,96,67],n(40)+(r()<.08?-30:0));break;
      case "stone": px(i,j,[128,128,128],n(36)+(r()<.07?-35:0));break;
      case "wood": {const seam=(j%4===3)||(i===((j>>2)%2?6:14));px(i,j,[168,134,80],(seam?-45:0)+n(18));break}
      case "sand": px(i,j,[222,208,160],n(22));break;
      case "leaves": r()<.13?px(i,j,[20,50,15],0,.9):px(i,j,[60,130,45],n(45));break;
      case "water": px(i,j,[55,100,220],((i+j*2)%9<2?35:0)+n(16),.92);break;
      case "glass": edge?px(i,j,[210,235,245]):((i-j===4||i-j===5)&&i>4&&i<13)?px(i,j,[255,255,255],0,.9):px(i,j,[200,230,255],0,.18);break;
      case "brick": {const m=(j%4===3)||(i===((j>>2)%2?3:11));px(i,j,m?[185,175,165]:[165,75,55],n(m?10:26));break}
      case "snow": px(i,j,[242,248,255],n(14));break;
      case "ice": px(i,j,[150,195,245],(edge?25:0)+((i*3+j*2)%13<2?45:0)+n(12));break;
      case "gold": px(i,j,[242,196,48],(edge?-60:0)+(i+j<7?40:0)+n(26));break;
      case "diamond": px(i,j,[80,226,224],(edge?-70:0)+(i+j<7?40:0)+((i*j)%7===0?-30:0)+n(26));break;
    }
  }
  return TEX[type]=c.toDataURL();
}

function drawSprite(map,pal,opt={}){
  const h=map.length,w=Math.max(...map.map(r=>r.length)),W=w+2,H=h+2;
  let seed=opt.seed||12345;const r=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  const g=[];for(let y=0;y<H;y++)g.push(Array(W).fill(null));
  const nz=opt.noise??14;
  map.forEach((row,y)=>[...row].forEach((ch,x)=>{const c=pal[ch];if(!c)return;const v=c[3]===0?0:(r()-.5)*nz;g[y+1][x+1]=[c[0]+v,c[1]+v,c[2]+v]}));
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const cl=v=>Math.max(0,Math.min(255,v))|0;
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){
    const c=g[y][i];
    if(c){x.fillStyle=`rgb(${cl(c[0])},${cl(c[1])},${cl(c[2])})`;x.fillRect(i,y,1,1)}
    else if(opt.outline!==false&&[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>g[y+dy]&&g[y+dy][i+dx])){x.fillStyle="#15110d";x.fillRect(i,y,1,1)}
  }
  return cv.toDataURL();
}

  let h=2166136261;for(const ch of `${cfg("SECRET")}|${n}|${dateStr}`){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}

}

function noRepeat(a){for(let k=0;k<20;k++){let ok=true;for(let i=1;i<a.length;i++)if(a[i].w.en===a[i-1].w.en){ok=false;const j=Math.random()*a.length|0;[a[i],a[j]]=[a[j],a[i]]}if(ok)break}return a}
function bossItems(i){
  let rev=[];for(let j=0;j<i;j++)rev.push(...words(j));
  const pool=[...shuf(words(i)),...shuf(rev).slice(0,3)];
  const kinds=["listen","pic","ru","listen","spell","pic","ru","listen","spell"];
  const items=shuf(kinds.map((k,n)=>({k,w:pool[n%pool.length]})));
  items.push({k:"sent",s:rnd(LESSONS[i].s)});
  return items;
}

function bindOpts(right,explain){
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{

  });
}
function tiles(tokens,isWords,head,speakText){
  let order=shuf(tokens.map((t,i)=>i));
  if(tokens.length>1)for(let k=0;k<10&&order.every((v,i)=>v===i);k++)order=shuf(order);
  const ans=[];
  frame(`${head}
    <div class="slots" id="slots"></div>
    <div class="tiles">${order.map(i=>`<button class="tile ${isWords?"w":""}" data-i="${i}">${esc(tokens[i])}</button>`).join("")}</div>
    <div class="gap"></div>
    <button class="btn gray small" id="back">⌫ Убрать последнее</button>
    <div class="answer" id="ans"></div>`);
  if(!isWords) setTimeout(()=>say(speakText),250);
  $("#say").onclick=()=>say(speakText,.7);
  const draw=()=>{$("#slots").innerHTML=tokens.map((_,k)=>`<div class="slot ${isWords?"w":""}">${ans[k]!==undefined?esc(tokens[ans[k]]):""}</div>`).join("")};
  draw();
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(L.lock||b.classList.contains("used"))return;
    beep("tap");ans.push(+b.dataset.i);b.classList.add("used");draw();
    if(ans.length===tokens.length){
      L.lock=true;
      const got=ans.map(k=>tokens[k]).join(isWords?" ":"");
      const ok=got===tokens.join(isWords?" ":"");
      $("#slots").classList.add(ok?"ok":"bad");
      if(!ok){$("#ans").textContent="Правильно: "+tokens.join(isWords?" ":"");$("#slots").classList.add("shake")}
      say(speakText);
      result(ok,isWords?1900:1500);
    }
  });
  $("#back").onclick=()=>{if(L.lock||!ans.length)return;const k=ans.pop();
    const t=[...document.querySelectorAll(".tile.used")].find(e=>+e.dataset.i===k);if(t)t.classList.remove("used");draw()};
}
function battleFx(ok){

  }
}
function result(ok,wait){
  const st=L.stages[L.si], boss=st.type==="boss";
  if(ok){beep("ok");L.done++;L.streak++;if(boss)L.hits++;reward()}
  else{
    beep("bad");L.streak=0;
    if(boss){L.mist++;battleFx(false);if(L.mist>=3){setTimeout(bossFail,1600);return}}
    else{st.q.push(Object.assign({},L.cur))}
  }
  if(ok&&boss) setTimeout(()=>battleFx(true),150);
  setTimeout(next, ok?(wait?1100:850):(wait||1700));
}
function reward(){
  let b;
  if(L.streak>0&&L.streak%6===0){b="diamond";S.dia++}
  else if(L.streak>0&&L.streak%4===0) b=rnd(["gold",...RARE]);
  else b=Math.random()<.2?rnd(RARE):rnd(COMMON);
  S.inv[b]=(S.inv[b]||0)+1;L.earned[b]=(L.earned[b]||0)+1;save();
  const t=document.createElement("div");t.className="toast";t.innerHTML=`+1 ${img(b)} ${b}`;document.body.appendChild(t);setTimeout(()=>t.remove(),1000);
}

  const [b,ru]=bossOf(L.i);
  frame(`<div class="panel card">
    ${boss?`<div class="big" style="min-height:130px">${pic("spr:"+b,isTall(b)?130:100)}</div>
      <div class="word" style="font-size:30px">${b}</div><div class="ru">${ru}</div>`
      :`<div class="big" style="font-size:80px">🎯</div><div class="word" style="font-size:28px">${st.name}</div>`}
    <div class="prompt">${txt}</div></div>
    <div class="gap"></div><button class="btn ${boss?"red":""}" id="go">${boss?"⚔️ В бой!":"Поехали!"}</button>`);
  if(boss) setTimeout(()=>say(b),300);
  $("#go").onclick=renderQ;
}
function bossFail(){
  const [b,ru]=bossOf(L.i);
  frame(`<div class="panel card"><div class="big">${pic("spr:"+b,isTall(b)?110:84)}</div><div class="word" style="font-size:26px">${ru} победил…</div>
    <div class="prompt">Ничего страшного! Блоки, которые ты добыл, остаются у тебя. Попробуй ещё раз.</div></div>
    <div class="gap"></div><button class="btn red" id="again">⚔️ Ещё раз в бой</button>`);
  $("#again").onclick=()=>{const st=L.stages[L.si];L.total-=st.q.length;st.q=bossItems(L.i);L.total+=st.q.length;L.done=L.total-st.q.length;L.mist=0;L.hits=0;L.pos=0;L.streak=0;renderQ()};
}
function finish(){
  const i=L.i, n=i+1, min=Math.max(1,Math.round((Date.now()-L.start)/60000)), score=10-L.mist;
  const repeat=!!S.done[i], tBefore=tierIdx();
  const chest={};const add=(b,k)=>{chest[b]=(chest[b]||0)+k;S.inv[b]=(S.inv[b]||0)+k};
  add(rnd(COMMON),6);add(rnd(COMMON),4);add(rnd(RARE),3);add("gold",2);
  if(!repeat){add("diamond",1);S.dia++}
  S.done[i]={score,min,date:today(),count:((S.done[i]&&S.done[i].count)||0)+1};
  save();
  const tAfter=tierIdx();
  const code=mkCode(n,today());
  const msg=`${cfg("CHILD_NAME")} прошёл урок ${n} «${LESSONS[i].t}»${repeat?" (повтор)":""} ✅\nБосс: ${score}/10, время: ${min} мин.\nКод: ${code}`;
  beep("win");
  const total={...L.earned};for(const b in chest)total[b]=(total[b]||0)+chest[b];
  const [b]=bossOf(i);
  app.innerHTML=`
    <div class="title" style="font-size:26px">УРОК ${n} ПРОЙДЕН!</div>
    <div class="center" style="color:var(--muted);margin-bottom:6px">Ты победил: <b style="color:var(--text)">${b}</b> 🏆</div>
    ${tAfter>tBefore?`<div class="panel center" style="border-color:var(--gold)"><div style="font-weight:900;color:var(--gold)">🎉 НОВЫЕ ИНСТРУМЕНТЫ!</div>
      <div class="newtools">${toolsRow(tAfter)}</div><div><b>${TIERS[tAfter][0]}</b> — ${TIERS[tAfter][1]}</div></div><div class="gap"></div>`:""}
    <div class="stats">
      <div class="stat panel">⚔️ ${score}/10<small>босс</small></div>
      <div class="stat panel">⏱ ${min}<small>минут</small></div>
    </div>
    <div class="panel"><div class="center" style="font-weight:800">🎁 Добыто за урок:</div>
      <div class="chest">${Object.entries(total).map(([b,k])=>`<div>${img(b)}×${k}</div>`).join("")}</div></div>
    <div class="gap"></div>
    <div class="panel center"><div style="color:var(--muted);font-size:14px">Код для папы</div><div class="code">${code}</div></div>
    <div class="gap"></div>
    <button class="btn gold" id="sms">📩 Отправить СМС папе</button>
    <div class="gap"></div>
    <div class="row"><button class="btn blue small" id="w">🏰 Строить</button><button class="btn gray small" id="h">🏠 Меню</button></div>`;
  if(tAfter>tBefore) setTimeout(()=>say(TIERS[tAfter][0]+" tools"),600);
  $("#sms").onclick=()=>{location.href=`sms:${cfg("PARENT_PHONE")}&body=${encodeURIComponent(msg)}`};
  $("#w").onclick=world;$("#h").onclick=home;
  L=null;
}

/* ============ МИР ДЛЯ СТРОЙКИ ============ */
let sel=null, breaking=false;
function world(){
  if(!sel||!S.inv[sel]) sel=BLOCKS.find(b=>S.inv[b]>0)||null;
  app.innerHTML=`
    <div class="top"><button class="x" id="h">✕</button><img class="px" src="${spr("hero")}" style="height:40px" alt=""><div style="flex:1;font-weight:900;font-size:20px">Мой мир</div><div style="font-weight:800">💎 ${S.dia}</div></div>
    <div class="world" id="wg">${S.world.map((b,k)=>`<button class="cell" data-k="${k}">${b?img(b):""}</button>`).join("")}</div>
    <div class="mode">
      <button class="btn small ${breaking?"off":""}" id="mPlace">🧱 Ставить</button>
      <button class="btn small red ${breaking?"":"off"}" id="mBreak"><img class="px" src="${spr("pickaxe")}" alt=""> Ломать</button>
    </div>
    <div class="selname" id="sn"></div>
    <div class="inv" id="inv"></div>
    <div class="tip">Нажми на блок внизу — услышишь его название по-английски. Блоки добываются в уроках!</div>`;
  $("#h").onclick=home;
  $("#mPlace").onclick=()=>{breaking=false;world()};
  $("#mBreak").onclick=()=>{breaking=true;world()};
  drawInv();
  $("#wg").onclick=e=>{
    const c=e.target.closest(".cell");if(!c)return;const k=+c.dataset.k;
    if(breaking){if(S.world[k]){const b=S.world[k];S.world[k]=null;S.inv[b]=(S.inv[b]||0)+1;c.innerHTML="";beep("tap");save();drawInv()}}
    else if(!S.world[k]&&sel&&S.inv[sel]>0){S.world[k]=sel;S.inv[sel]--;c.innerHTML=img(sel);beep("tap");save();drawInv()}
    else if(!S.world[k]){beep("bad")}
  };
}
function drawInv(){
  $("#inv").innerHTML=BLOCKS.map(b=>`<button class="it ${b===sel?"sel":""} ${S.inv[b]?"":"zero"}" data-b="${b}">${img(b)}${b}<b>×${S.inv[b]||0}</b></button>`).join("");
  $("#sn").innerHTML=sel?`${sel} <span style="color:var(--muted);font-weight:600">— ${BLOCK_RU[sel]}</span>`:"Пока нет блоков — пройди урок!";
  document.querySelectorAll(".it").forEach(e=>e.onclick=()=>{sel=e.dataset.b;say(sel);if(breaking){breaking=false;world()}else drawInv()});
}

/* ============ РОДИТЕЛЯМ ============ */
function parentGate(){
  app.innerHTML=`<div class="top"><button class="x" id="h">✕</button><div style="font-weight:900;font-size:20px">👨 Родителям</div></div>
    <div class="panel"><label>Введи PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div class="gap"></div><button class="btn" id="ok">Войти</button></div>`;
  $("#h").onclick=home;
  $("#ok").onclick=()=>{if($("#pin").value===cfg("PIN"))parent();else{beep("bad");$("#pin").value="";$("#pin").classList.add("shake")}};
}
function parent(){
  const yest=new Date(Date.now()-864e5);
  app.innerHTML=`<div class="top"><button class="x" id="h">✕</button><div style="font-weight:900;font-size:20px">👨 Родителям</div></div>
    <div class="panel">
      <div style="font-weight:800">Проверить код из СМС</div>
      <label>Номер урока</label><input id="ln" type="number" inputmode="numeric" min="1" max="${LESSONS.length}">
      <div class="answer" id="cv"></div>
    </div><div class="gap"></div>
    <div class="panel">
      <div style="font-weight:800">Настройки</div>
      <label>Имя ребёнка</label><input id="cn" value="${esc(cfg("CHILD_NAME"))}">
      <label>Номер для СМС</label><input id="ph" type="tel" value="${esc(cfg("PARENT_PHONE"))}">
      <label>Новый PIN (оставь пустым, если не меняешь)</label><input id="np" type="password" inputmode="numeric">
      <div class="gap"></div><button class="btn" id="sv">💾 Сохранить</button>
    </div><div class="gap"></div>
    <div class="panel">
      <div style="font-weight:800">📦 Перенос прогресса</div>
      <div style="color:var(--muted);font-size:14px;margin:6px 0 10px">Уроки, блоки, алмазы и мир. На старом телефоне или адресе нажми «Скопировать код», на новом вставь его и нажми «Загрузить».</div>
      <button class="btn small blue" id="exCopy">📋 Скопировать код прогресса</button>
      <label>Код прогресса</label><input id="imCode" autocomplete="off">
      <div class="gap"></div><button class="btn small gold" id="imLoad">📥 Загрузить</button>
    </div><div class="gap"></div>
    <div class="panel">
      <div style="font-weight:800">🔔 Напоминания об уроке</div>
      <div style="color:var(--muted);font-size:14px;margin:6px 0 10px">Каждый день в 16:00 и 19:00 на этот телефон придёт напоминание. Включи на телефоне Никиты и на своём.</div>
      <div id="pushBox"></div>
    </div><div class="gap"></div>
    <div class="panel">
      <div style="font-weight:800;margin-bottom:8px">Пройденные уроки</div>
      ${LESSONS.map((l,i)=>S.done[i]?`<div style="margin:4px 0">✅ ${i+1}. ${esc(l.t)} — ${S.done[i].score}/10, ${S.done[i].min} мин, ${S.done[i].date}${S.done[i].count>1?` (раз: ${S.done[i].count})`:""}</div>`:"").join("")||"<div style='color:var(--muted)'>Пока ни одного</div>"}
      <div class="gap"></div><button class="btn red small" id="rs">Сбросить весь прогресс</button>
    </div>`;
  $("#h").onclick=home;
  $("#ln").oninput=e=>{const n=+e.target.value;$("#cv").innerHTML=n>=1&&n<=LESSONS.length?`Сегодня: <span style="color:var(--gold)">${mkCode(n,today())}</span><br><small style="color:var(--muted)">Вчера: ${mkCode(n,today(yest))}</small>`:""};
  $("#sv").onclick=()=>{S.cfg.CHILD_NAME=$("#cn").value.trim()||CONFIG.CHILD_NAME;S.cfg.PARENT_PHONE=$("#ph").value.trim()||CONFIG.PARENT_PHONE;
    if($("#np").value.trim())S.cfg.PIN=$("#np").value.trim();save();beep("ok");$("#sv").textContent="✅ Сохранено"};
  $("#rs").onclick=()=>{if(confirm("Точно сбросить все уроки, блоки и мир?")){const c=S.cfg;S=def();S.cfg=c;save();home()}};
  $("#exCopy").onclick=async()=>{const code=progressCode();$("#imCode").value=code;try{await navigator.clipboard.writeText(code);$("#exCopy").textContent="✅ Скопировано"}catch(e){$("#imCode").select()}};
  $("#imLoad").onclick=()=>{
    let d;try{d=JSON.parse(decodeURIComponent(escape(atob($("#imCode").value.trim()))))}catch(e){}
    if(!d||typeof d.done!=="object"){beep("bad");$("#imCode").classList.add("shake");return}
    if(!confirm("Заменить текущий прогресс на загруженный?"))return;
    const c=S.cfg;S=Object.assign(def(),d);S.cfg=Object.assign({},d.cfg,c);
    if(!Array.isArray(S.world)||S.world.length!==COLS*ROWS)S.world=Array(COLS*ROWS).fill(null);
    save();beep("ok");home();
  };
  pushPanel();
}
// Код прогресса: весь S в base64 (с поддержкой кириллицы), чтобы перенести на другой адрес или телефон.
const progressCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(S))));

/* ============ НАПОМИНАНИЯ (push) ============
   Телефон подписывается здесь, а присылает напоминания GitHub по расписанию.
   Код подписки нужно один раз добавить в reminders/subscriptions.txt. */
const VAPID_PUBLIC_KEY = "BDAi5C8ne202Y3UocPtPGlVZJrcsLrXZrQOMjR2xxqvOz1vGuRZVD6Ndr5jeg5IsS_TdfF1zkUq6vT5E-rYghEI";
const b64key = k => {const s=atob((k+"=".repeat((4-k.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(s,c=>c.charCodeAt(0))};
const subCode = sub => btoa(JSON.stringify(sub));

async function pushPanel(){
  const box=$("#pushBox"); if(!box)return;
  const standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    box.innerHTML=`<div class="answer" style="font-size:15px;font-weight:600">${standalone?"Этот телефон не поддерживает уведомления. Нужен iOS 16.4 или новее.":"Сначала добавь приложение на экран «Домой»: в Safari нажми «Поделиться» → «На экран „Домой“». Потом открой его с экрана и зайди сюда снова."}</div>`;
    return;
  }
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription();
  if(sub&&Notification.permission==="granted"){
    box.innerHTML=`<div style="font-weight:800;color:var(--green)">✅ Уведомления включены</div>
      <label>Код этого телефона (добавь его в GitHub один раз)</label>
      <input id="pc" readonly value="${esc(subCode(sub))}">
      <div class="gap"></div><div class="row"><button class="btn small blue" id="pcCopy">📋 Скопировать</button><button class="btn small gray" id="pcTest">🔔 Проверить</button></div>`;
    $("#pcCopy").onclick=async()=>{try{await navigator.clipboard.writeText(subCode(sub));$("#pcCopy").textContent="✅ Скопировано"}catch(e){$("#pc").select()}};
    $("#pcTest").onclick=()=>reg.showNotification("📚 Block English",{body:"Так будет выглядеть напоминание об уроке",icon:"icon.png",tag:"lesson-reminder"});
    return;
  }
  if(Notification.permission==="denied"){
    box.innerHTML=`<div class="answer" style="font-size:15px;font-weight:600">Уведомления запрещены. Разреши их: Настройки iPhone → Уведомления → Block English.</div>`;
    return;
  }
  box.innerHTML=`<button class="btn small gold" id="pushOn">🔔 Включить напоминания</button>`;
  $("#pushOn").onclick=async()=>{
    try{
      if(await Notification.requestPermission()!=="granted")return pushPanel();
      await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64key(VAPID_PUBLIC_KEY)});
      beep("ok");
    }catch(e){alert("Не получилось включить: "+e.message)}
    pushPanel();
  };
}

home();

/* ============ ОФЛАЙН-РЕЖИМ ============ */
if ("serviceWorker" in navigator) {
  try { navigator.serviceWorker.register("sw.js").catch(()=>{}); } catch(e) {}
}
</script>
